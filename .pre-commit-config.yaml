repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: end-of-file-fixer
    -   id: check-added-large-files
        args: [--maxkb=51200]

-   repo: local
    hooks:
    -   id: black
        name: black
        entry: uv run black .
        language: system
        types: [python]
    -   id: isort
        name: isort
        entry: uv run isort .
        language: system
        types: [python]
