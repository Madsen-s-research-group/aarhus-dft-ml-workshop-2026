[project]
name = "aarhus-dft-ml-workshop-2026"
version = "0.1.0"
description = "uv environment setup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.26.0",
    "black>=26.3.1",
    "gpaw>=25.7.0",
    "icet>=3.2",
    "ipykernel>=6.31.0",
    "isort>=8.0.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "mdanalysis>=2.10.0",
    "mdtraj>=1.11.1.post1",
    "nbclassic>=1.3.3",
    "nglview==3.1.4",
    "notebook>=7.5.5",
    "numpy>=2.0.2",
    "phonopy>=3.5.1",
    "pre-commit>=4.5.1",
    "scipy>=1.13.1",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "mace-torch==0.3.15",
]
cu126 = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "mace-torch==0.3.15",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.black]
line-length = 79
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 79
